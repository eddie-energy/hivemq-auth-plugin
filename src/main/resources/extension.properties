# Environment placeholders use ${NAME} for required values and ${NAME:default} for defaults.
db.url=${HIVEMQ_DB_URL:jdbc:postgresql://postgres:5432/eddie}
db.username=${HIVEMQ_DB_USERNAME:emqx}
db.password=${HIVEMQ_DB_PASSWORD}
db.pool.maximum-size=${HIVEMQ_DB_POOL_MAX_SIZE:4}
db.pool.minimum-idle=${HIVEMQ_DB_POOL_MIN_IDLE:0}
db.connection-timeout-ms=${HIVEMQ_DB_CONNECTION_TIMEOUT_MS:3000}
db.validation-timeout-ms=${HIVEMQ_DB_VALIDATION_TIMEOUT_MS:2000}
db.idle-timeout-ms=${HIVEMQ_DB_IDLE_TIMEOUT_MS:600000}
db.max-lifetime-ms=${HIVEMQ_DB_MAX_LIFETIME_MS:1800000}
db.query-timeout-seconds=${HIVEMQ_DB_QUERY_TIMEOUT_SECONDS:3}

query.password=${HIVEMQ_PASSWORD_QUERY:SELECT password_hash FROM aiida.aiida_mqtt_user WHERE username = ? LIMIT 1}
query.superuser=${HIVEMQ_SUPERUSER_QUERY:SELECT count(*) FROM aiida.aiida_mqtt_user WHERE username = ? AND is_superuser = true}
query.acl=${HIVEMQ_ACL_QUERY:SELECT topic FROM aiida.aiida_mqtt_acl WHERE username = ? AND acl_type = 'ALLOW' AND action = ?}
query.publish-action=${HIVEMQ_PUBLISH_ACTION:PUBLISH}
query.subscribe-action=${HIVEMQ_SUBSCRIBE_ACTION:SUBSCRIBE}

cache.enabled=${HIVEMQ_CACHE_ENABLED:true}
cache.authentication-ttl-seconds=${HIVEMQ_AUTH_CACHE_SECONDS:300}
cache.authorization-ttl-seconds=${HIVEMQ_ACL_CACHE_SECONDS:300}
cache.authentication-jitter-seconds=${HIVEMQ_AUTH_CACHE_JITTER_SECONDS:15}
cache.authorization-jitter-seconds=${HIVEMQ_ACL_CACHE_JITTER_SECONDS:15}
cache.maximum-entries=${HIVEMQ_CACHE_MAXIMUM_ENTRIES:10000}

local-superuser.enabled=${HIVEMQ_LOCAL_SUPERUSER_ENABLED:true}
local-superuser.username=${HIVEMQ_LOCAL_SUPERUSER_USERNAME:eddie}
local-superuser.password=${AIIDA_MQTT_PASSWORD:}

callback.timeout-ms=${HIVEMQ_AUTH_CALLBACK_TIMEOUT_MS:5000}
security.maximum-username-bytes=${HIVEMQ_MAXIMUM_USERNAME_BYTES:1024}
security.maximum-password-bytes=${HIVEMQ_MAXIMUM_PASSWORD_BYTES:4096}
